<svg width="480" height="600" viewBox="0 0 480 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sahitya Kumar Suman">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12121a" />
      <stop offset="1" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="480" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="0.5" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#84cc16" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.75" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mono" x1="140" y1="220" x2="340" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#c7d2fe" />
    </linearGradient>
  </defs>

  <rect width="480" height="600" rx="32" fill="url(#bg)" />
  <rect width="480" height="600" rx="32" fill="url(#glowA)" />
  <rect width="480" height="600" rx="32" fill="url(#glowB)" />

  <!-- Abstract figure silhouette -->
  <g opacity="0.9">
    <circle cx="240" cy="248" r="66" fill="#1c1c28" stroke="url(#ring)" stroke-width="2.5" />
    <path d="M132 470c0-64 48-116 108-116s108 52 108 116v40H132v-40z" fill="#1c1c28" stroke="url(#ring)" stroke-width="2.5" />
  </g>

  <!-- Monogram initials -->
  <text x="240" y="278" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="72" font-weight="700" fill="url(#mono)">SKS</text>

  <!-- Label -->
  <g transform="translate(240 512)">
    <rect x="-104" y="-20" width="208" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="0" y="5" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">Lead Software Engineer</text>
  </g>

  <rect x="1.5" y="1.5" width="477" height="597" rx="30.5" fill="none" stroke="url(#ring)" stroke-opacity="0.35" stroke-width="1.5" />
</svg>
